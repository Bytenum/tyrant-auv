[env:teensy41]
platform = teensy@4.18.0
board = teensy41
framework = arduino

board_microros_distro = humble
board_microros_transport = serial

monitor_speed = 115200

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio

[env:teensy41-debug]
extends = env:teensy41

build_flags =
    -DTYRANT_ENABLE_DIAGNOSTICS

[env:teensy41-test]
extends = env:teensy41

build_flags =
    -DUNITY_SUPPORT_64

test_build_src = yes

build_src_filter =
    -<*>
    +<sensors/sensor_manager.cpp>
    +<sensors/depth_estimator.cpp>
    +<sensors/imu_mounting.cpp>
    +<estimation/quaternion_math.cpp>